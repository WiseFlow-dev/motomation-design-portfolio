<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32">
  <!-- Background Circle (Deep Ink Black) -->
  <circle cx="16" cy="16" r="15" fill="#0d0c0a" stroke="#f2ede4" stroke-width="0.8" />
  
  <!-- Outer Concentric Ring (dashed/dotted style) -->
  <circle cx="16" cy="16" r="11.5" fill="none" stroke="#f2ede4" stroke-width="0.6" stroke-dasharray="1 1.5" opacity="0.4" />
  
  <!-- Inner Concentric Ring (Signal Orange) -->
  <circle cx="16" cy="16" r="8" fill="none" stroke="#ff4d00" stroke-width="1.2" opacity="0.95" />
  
  <!-- Geometric Letter M -->
  <path d="M 10 21 L 10 11 L 13.5 11 L 16 14.2 L 18.5 11 L 22 11 L 22 21 L 19.5 21 L 19.5 14.5 L 16 18.2 L 12.5 14.5 L 12.5 21 Z" fill="#f2ede4" />
  
  <!-- Plus sign accent (Orange) -->
  <path d="M 6.5 8.5 L 6.5 6.5 M 5.5 7.5 L 7.5 7.5" fill="none" stroke="#ff4d00" stroke-width="0.8" />
  
  <!-- Kinetic dot accent (Orange) -->
  <circle cx="24" cy="22.5" r="0.95" fill="#ff4d00" />
</svg>
